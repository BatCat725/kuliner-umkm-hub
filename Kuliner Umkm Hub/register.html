<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — Kuliner UMKM Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-side">
    <a href="index.html" class="brand" style="color:#F7EFDD;font-size:22px">Kuliner<span style="color:var(--turmeric)">UMKM</span></a>
    <div>
      <h2>Buka <span class="grad-text">lapak digitalmu</span> dalam beberapa menit.</h2>
      <p>Gratis untuk usaha kuliner mikro dan kecil. Tanpa komisi di tahun pertama.</p>
    </div>
  </div>
  <div class="auth-main">
    <div class="auth-card">
      <a href="index.html" class="brand" style="font-size:20px;color:var(--chili)">Kuliner<span style="color:var(--leaf)">UMKM</span></a>
      <h1>Daftarkan usahamu</h1>
      <div class="sub">Isi data berikut untuk membuat lapak baru.</div>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="field">
          <label for="nama">Nama usaha</label>
          <input type="text" id="nama" placeholder="Contoh: Dapur Bu Sari" required>
        </div>
        <div class="field">
          <label for="kategori">Kategori usaha</label>
          <select id="kategori" required>
            <option value="">Pilih kategori</option>
            <option>Nasi &amp; Lauk</option>
            <option>Katering</option>
            <option>Minuman</option>
            <option>Kue &amp; Kudapan</option>
            <option>Frozen Food</option>
          </select>
        </div>
        <div class="field">
          <label for="email2">Email</label>
          <input type="email" id="email2" placeholder="nama@usahakamu.com" required>
        </div>
        <div class="field">
          <label for="pass2">Kata sandi</label>
          <input type="password" id="pass2" placeholder="Minimal 8 karakter" required>
        </div>
        <button type="submit" class="btn btn-solid btn-block">Buat Lapak</button>
      </form>

      <div class="auth-foot">Sudah punya lapak? <a href="login.html">Masuk di sini</a></div>
    </div>
  </div>
</div>

</body>
</html>
